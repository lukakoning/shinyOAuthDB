services:
  database:
    image: trinodb/trino:484@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
    network_mode: service:keycloak
    user: "0:0"
    mem_limit: 2g
    entrypoint: ["bash", "/demo/trino/start.sh"]
    volumes:
      - .:/demo:ro
      - ./trino/etc:/etc/trino:ro
      - tls:/fixtures/tls:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "/demo/trino/healthcheck.sh"]
      interval: 3s
      timeout: 5s
      start_period: 30s
      retries: 60
  app:
    build:
      target: trino
    environment:
      OAUTHDB_DEMO: trino
    depends_on:
      database:
        condition: service_healthy
