listen_addresses = 'localhost'
port = 5432
unix_socket_directories = '/var/run/postgresql'
hba_file = '/etc/oauthdb-fixture/pg_hba.conf'
ident_file = '/etc/oauthdb-fixture/pg_ident.conf'
ssl = on
ssl_cert_file = '/run/oauthdb-tls/server-cert.pem'
ssl_key_file = '/run/oauthdb-tls/server-key.pem'
ssl_min_protocol_version = 'TLSv1.2'
oauth_validator_libraries = 'pg_oidc_validator'
pg_oidc_validator.authn_field = 'sub'
pg_oidc_validator.expected_audience = 'postgres-fixture'
log_connections = on
log_statement = 'none'
log_min_error_statement = 'panic'
log_error_verbosity = 'terse'
logging_collector = off
