# Only container-local Unix peer authentication can administer the fixture.
local   all                postgres                       peer
local   all                all                            reject
# Fixture administration is separate from delegated end-user authentication.
hostssl oauthdb_fixture    postgres  127.0.0.1/32          scram-sha-256
hostssl oauthdb_fixture    postgres  ::1/128               scram-sha-256
# OAUTHBEARER is the sole TCP authentication path; no password/trust fallback.
hostssl oauthdb_fixture    alice,bob 127.0.0.1/32          oauth issuer="https://localhost:18443/realms/shinyoauthdb" scope="database.read" validator=pg_oidc_validator map=keycloak_subjects
hostssl oauthdb_fixture    alice,bob ::1/128               oauth issuer="https://localhost:18443/realms/shinyoauthdb" scope="database.read" validator=pg_oidc_validator map=keycloak_subjects
host    all                all       0.0.0.0/0            reject
host    all                all       ::0/0                reject
