url: https://lukakoning.github.io/shinyOAuthDB/
destination: _site
redirects:
  - [articles/oauth-setup.html, 'articles/getting-started.html#register-your-app']
  - [articles/authorization.html, 'articles/getting-started.html#sessions-saved-results-and-extra-permissions']
  - [articles/local-demos.html, 'articles/getting-started.html#build-a-small-app']
  - [articles/cloud-demos.html, 'articles/getting-started.html#more-ways-to-try-an-app']
template:
  bootstrap: 5
home:
  title: Query data in Shiny with each visitor's account
navbar:
  structure:
    left: [intro, articles, reference]
    right: [search, github]
  components:
    intro:
      text: Start here
      href: articles/getting-started.html
    articles:
      text: Guides
      menu:
        - text: Getting started
          href: articles/getting-started.html
        - text: All data source guides
          href: articles/index.html
articles:
  - title: Start here
    contents: [getting-started]
  - title: PostgreSQL and query engines
    contents: [postgres, postgrest, duckdb, trino]
  - title: Cloud data platforms and managed databases
    contents: [databricks, fabric, snowflake, bigquery, redshift, athena, azure-sql,
      azure-postgres, azure-mysql, cloud-sql, cosmos, supabase]
  - title: More databases and APIs
    contents: [oracle, oracle-ords, mongodb, elasticsearch, opensearch, neo4j,
      hana, salesforce, clickhouse, singlestore, starrocks, libsql,
      cockroachdb, dremio, cratedb]
reference:
  - title: Overview and demos
    contents: [shinyOAuthDB-package, oauth_db_demo, oauth_db_cloud_demo]
  - title: PostgreSQL
    contents: [oauth_db_postgres, oauth_db_postgrest_api]
  - title: DuckDB
