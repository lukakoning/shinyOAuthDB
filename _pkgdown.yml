url: https://lukakoning.github.io/shinyOAuthDB/
destination: _site
redirects:
  - [articles/oauth-setup.html, 'articles/getting-started.html#register-your-app']
  - [articles/authorization.html, 'articles/getting-started.html#sessions-saved-results-and-extra-permissions']
  - [articles/local-demos.html, 'articles/getting-started.html#build-a-small-app']
  - [articles/cloud-demos.html, 'articles/getting-started.html#more-ways-to-try-an-app']
template:
  bootstrap: 5
home:
  title: Query data in Shiny with each visitor's account
navbar:
  structure:
    left: [intro, articles, reference]
    right: [search, github]
  components:
    intro:
      text: Start here
      href: articles/getting-started.html
    articles:
      text: Guides
      menu:
        - text: Getting started
          href: articles/getting-started.html
        - text: All database guides
          href: articles/index.html
articles:
  - title: Start here
    contents: [getting-started]
  - title: Self-hosted databases and APIs
    contents: [postgres, postgrest, trino, starrocks, duckdb, libsql, cratedb, opensearch, oracle, oracle-ords, hana]
  - title: Cloud platforms
    contents: [fabric, databricks, snowflake, bigquery, azure-sql, azure-postgres, redshift, clickhouse, supabase, salesforce]
reference:
  - title: Demos
    contents: [oauth_db_demo, oauth_db_cloud_demo]
  - title: Database connections
    contents: [oauth_db_postgres, oauth_db_azure_postgres, oauth_db_azure_sql, oauth_db_sql_server,
      oauth_db_fabric_sql, oauth_db_databricks, oauth_db_snowflake, oauth_db_redshift,
      oauth_db_trino, oauth_db_starrocks, oauth_db_duckdb, oauth_db_oracle, oauth_db_hana, oauth_db_connect]
  - title: API clients
    contents: [oauth_db_bigquery_api, oauth_db_clickhouse_api, oauth_db_cratedb_api,
      oauth_db_databricks_api, oauth_db_fabric_api, oauth_db_libsql_api,
      oauth_db_opensearch_api, oauth_db_oracle_ords_api, oauth_db_postgrest_api,
      oauth_db_salesforce_api, oauth_db_salesforce_data_cloud_api, oauth_db_supabase_api]
  - title: Sign-in clients and providers
    contents: [oauth_db_microsoft_client, oauth_db_bigquery_client, oauth_db_salesforce_client,
      oauth_db_databricks_client, oauth_db_databricks_provider,
      oauth_db_snowflake_client, oauth_db_snowflake_provider, oauth_db_supabase_client]
  - title: Credentials and package help
    contents: [oauth_db_fabric, oauth_db_token, shinyOAuthDB-package]
