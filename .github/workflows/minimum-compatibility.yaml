name: Minimum R and core dependencies
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minimum-${{ github.ref }}
  cancel-in-progress: true
jobs:
  minimum:
    name: Core tests / R ${{ matrix.r }} / minimum dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - r: '4.1.0'
            testthat: testthat@3.2.0
            expected-testthat: '3.2.0'
          # testthat 3.2.0 uses SET_FORMALS, which newer R no longer exports.
          - r: release
            testthat: any::testthat
            expected-testthat: release
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYOAUTHDB_POSTGRES_OAUTH: disabled
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          install-pandoc: false
          install-quarto: false
          extra-packages: |
            DBI@1.2.0
            httr2@1.2.0
            curl@6.4.0
            shiny@1.8.1
            ${{ matrix.testthat }}
            any::RSQLite
            any::pkgload
            any::jsonlite
            any::S7
            github::lukakoning/shinyOAuth@42176847f6ab82c2b49095f81a829cdd8ce60260
      - name: Run core tests at their dependency floors
        env:
          OAUTHDB_EXPECTED_R: ${{ matrix.r == '4.1.0' && '4.1.0' || '' }}
          OAUTHDB_EXPECTED_TESTTHAT: ${{ matrix.expected-testthat }}
        run: Rscript --vanilla tools/check-minimum.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimum-core-R-${{ matrix.r }}
          path: .validation/minimum/
          include-hidden-files: true
          if-no-files-found: error
