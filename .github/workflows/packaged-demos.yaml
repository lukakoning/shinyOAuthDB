name: Packaged Docker demos
on:
  pull_request:
    paths: ['inst/docker/**', 'R/demo.R', 'tools/check-demos.R', '.github/workflows/packaged-demos.yaml']
  push:
    branches: [main, master]
    paths: ['inst/docker/**', 'R/demo.R', 'tools/check-demos.R', '.github/workflows/packaged-demos.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, postgrest, trino, starrocks, duckdb, libsql, cratedb, opensearch]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYOAUTHDB_POSTGRES_OAUTH: disabled
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: 'c("Depends", "Imports")'
          extra-packages: |
            any::pkgbuild
            any::callr
            any::chromote
            any::jsonlite
            github::lukakoning/shinyOAuth@42176847f6ab82c2b49095f81a829cdd8ce60260
      - name: Test the installed demo and real sign-in
        run: Rscript --vanilla tools/check-demos.R ${{ matrix.database }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-${{ matrix.database }}
          path: .validation/demos/
          include-hidden-files: true
          if-no-files-found: error
