name: Minimum backend SDKs
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minimum-backends-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: ${{ matrix.package }} ${{ matrix.version }} / R release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: brickster
            version: '0.2.14'
          - package: fabricQueryR
            version: '1.0.1'
          - package: RTrino
            version: '0.1.0'
          - package: odbc
            version: '1.4.2'
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYOAUTHDB_POSTGRES_OAUTH: disabled
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            ${{ matrix.package }}@${{ matrix.version }}
            any::pkgbuild
            any::pkgload
            github::lukakoning/shinyOAuth@42176847f6ab82c2b49095f81a829cdd8ce60260
          needs: check
          install-pandoc: false
          install-quarto: false
      - name: Test the installed SDK at its exact declared minimum
        run: Rscript --vanilla tools/check-backend-minimum.R ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimum-backend-${{ matrix.package }}-${{ matrix.version }}
          path: .validation/minimum-backends/${{ matrix.package }}/
          include-hidden-files: true
          if-no-files-found: error
