name: Selected mutation checks
on:
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mutations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mutations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYOAUTHDB_POSTGRES_OAUTH: disabled
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::callr
            github::lukakoning/shinyOAuth@42176847f6ab82c2b49095f81a829cdd8ce60260
      - name: Require each mutant to fail its named test
        run: Rscript --vanilla tools/check-mutations.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-mutations
          path: .validation/mutations/
          include-hidden-files: true
          if-no-files-found: error
