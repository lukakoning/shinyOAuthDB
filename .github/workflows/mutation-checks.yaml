name: Mutation testing
on:
  pull_request:
    paths: ['R/**', 'tests/testthat/**', 'tools/check-mutations.R', 'tools/mutation-policy.R']
  schedule:
    - cron: '37 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mutations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  selected-guards:
    name: Named guard regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYOAUTHDB_POSTGRES_OAUTH: disabled
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::callr
            github::lukakoning/shinyOAuth@42176847f6ab82c2b49095f81a829cdd8ce60260
      - name: Require each mutant to fail its named test
        run: Rscript --vanilla tools/check-mutations.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-mutations
          path: .validation/mutations/
          include-hidden-files: true
          if-no-files-found: error
  mutator:
    if: github.event_name != 'pull_request'
    name: mutator / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: transport
            mutants: 60
          - profile: lifecycle
            mutants: 20
          - profile: bigquery
            mutants: 60
          - profile: clickhouse
            mutants: 40
          - profile: postgrest
            mutants: 40
          - profile: fabric
            mutants: 40
          - profile: trino
            mutants: 60
          - profile: odbc
            mutants: 40
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYOAUTHDB_POSTGRES_OAUTH: disabled
      OAUTHDB_MUTATOR_LIMIT: ${{ matrix.mutants }}
      OAUTHDB_MUTATOR_CORES: '2'
      OAUTHDB_MUTATOR_SEED: '20261104'
      OAUTHDB_MUTATOR_TIMEOUT: '240'
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            mutator@0.3.0
            any::callr
            github::lukakoning/shinyOAuth@42176847f6ab82c2b49095f81a829cdd8ce60260
      - name: Generate and test sampled AST mutations
        run: Rscript --vanilla tools/check-mutator.R ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutator-${{ matrix.profile }}
          path: |
            .validation/mutator/${{ matrix.profile }}/baseline/
            .validation/mutator/${{ matrix.profile }}/*.json
            .validation/mutator/${{ matrix.profile }}/*.csv
            .validation/mutator/${{ matrix.profile }}/*.rds
            .validation/mutator/${{ matrix.profile }}/mutants/
            .validation/mutator/${{ matrix.profile }}/original/
          include-hidden-files: true
          if-no-files-found: error
