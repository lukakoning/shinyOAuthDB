name: Latest upstream compatibility
on:
  schedule:
    - cron: '19 4 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYOAUTHDB_POSTGRES_OAUTH: disabled
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          upgrade: 'TRUE'
          extra-packages: |
            any::pkgbuild
            any::rcmdcheck
            github::lukakoning/shinyOAuth@master
          needs: check
      - run: Rscript --vanilla tools/check-package.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-compatibility
          path: .validation/
          include-hidden-files: true
          if-no-files-found: error
