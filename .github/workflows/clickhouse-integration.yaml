name: ClickHouse HTTP integration
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clickhouse-http-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clickhouse-http:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: shinyOAuthDB
      - uses: actions/checkout@v6
        with:
          repository: lukakoning/shinyOAuth
          ref: 42176847f6ab82c2b49095f81a829cdd8ce60260
          path: shinyOAuth
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: shinyOAuthDB
          dependencies: 'FALSE'
          extra-packages: any::processx
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: shinyOAuthDB/integration/local
          target: runner
          tags: shinyoauthdb-local-runner:1
          load: true
          cache-from: type=gha,scope=clickhouse-runner
          cache-to: type=gha,mode=max,scope=clickhouse-runner
      - name: Build fixture CA initializer
        working-directory: shinyOAuthDB
        run: docker build --target tls --tag shinyoauthdb-local-tls:1 integration/local
      - name: Test public HTTPS queries and non-replayed writes
        working-directory: shinyOAuthDB
        env:
          OAUTHDB_SKIP_BASE_BUILD: '1'
        run: Rscript --vanilla tools/check-clickhouse-http.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clickhouse-http-results
          path: shinyOAuthDB/integration/clickhouse-http/.generated/
          include-hidden-files: true
          if-no-files-found: error
