name: Compatibility

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '19 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-core:
    if: github.event_name != 'schedule'
    name: Core tests / R ${{ matrix.r }} / minimum dependencies
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - r: '4.1.0'
            testthat: testthat@3.2.0
            expected-testthat: '3.2.0'
          # testthat 3.2.0 uses SET_FORMALS, which newer R no longer exports.
          - r: release
            testthat: any::testthat
            expected-testthat: release
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYOAUTHDB_POSTGRES_OAUTH: disabled
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          install-pandoc: false
          install-quarto: false
          extra-packages: |
            DBI@1.2.0
            httr2@1.2.0
            curl@6.4.0
            shiny@1.8.1
            ${{ matrix.testthat }}
            any::RSQLite
            any::pkgload
            any::jsonlite
            any::S7
            github::lukakoning/shinyOAuth@42176847f6ab82c2b49095f81a829cdd8ce60260
      - name: Run core tests at their dependency floors
        env:
          OAUTHDB_EXPECTED_R: ${{ matrix.r == '4.1.0' && '4.1.0' || '' }}
          OAUTHDB_EXPECTED_TESTTHAT: ${{ matrix.expected-testthat }}
        run: Rscript --vanilla tools/check-minimum.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimum-core-R-${{ matrix.r }}
          path: .validation/minimum/
          include-hidden-files: true
          if-no-files-found: error

  minimum-backends:
    if: github.event_name != 'schedule'
    name: ${{ matrix.package }} ${{ matrix.version }} / R ${{ matrix.r }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: brickster
            version: '0.2.14'
            r: release
          - package: fabricQueryR
            version: '1.0.1'
            r: release
          - package: RTrino
            version: '0.1.0'
            r: release
          - package: odbc
            version: '1.4.2'
            # Its configure script uses CXX11, removed in R 4.6.
            r: '4.5'
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYOAUTHDB_POSTGRES_OAUTH: disabled
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            ${{ matrix.package }}@${{ matrix.version }}
            any::pkgbuild
            any::pkgload
            github::lukakoning/shinyOAuth@42176847f6ab82c2b49095f81a829cdd8ce60260
          needs: check
          install-pandoc: false
          install-quarto: false
      - name: Test the installed SDK at its exact declared minimum
        run: Rscript --vanilla tools/check-backend-minimum.R ${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimum-backend-${{ matrix.package }}-${{ matrix.version }}
          path: .validation/minimum-backends/${{ matrix.package }}/
          include-hidden-files: true
          if-no-files-found: error

  upstream:
    name: Latest upstream shinyOAuth
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYOAUTHDB_POSTGRES_OAUTH: disabled
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          upgrade: 'TRUE'
          extra-packages: |
            any::pkgbuild
            any::rcmdcheck
            github::lukakoning/shinyOAuth@master
          needs: check
      - name: Require the full source suite
        run: Rscript --vanilla tools/check-package.R --tests-only
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: '"--no-manual"'
          error-on: '"note"'
          upload-results: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-compatibility
          path: .validation/
          include-hidden-files: true
          if-no-files-found: error
