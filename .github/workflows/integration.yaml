name: Integration
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: shinyOAuthDB
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYOAUTHDB_POSTGRES_OAUTH: disabled
      OAUTHDB_SKIP_BASE_BUILD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          path: shinyOAuthDB
      - uses: actions/checkout@v6
        with:
          repository: lukakoning/shinyOAuth
          ref: 42176847f6ab82c2b49095f81a829cdd8ce60260
          path: shinyOAuth
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          # The local DuckDB demo's matching binary client uses R 4.5.
          r-version: "4.5"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: shinyOAuthDB
          extra-packages: |
            any::chromote
            any::pkgbuild
            any::pkgload
            github::lukakoning/shinyOAuth@42176847f6ab82c2b49095f81a829cdd8ce60260
          needs: check
      - name: Install the matching DuckDB demo client
        run: Rscript --vanilla inst/docker/install-duckdb.R
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - uses: docker/setup-buildx-action@v3
      - name: Cache the shared database and browser runner
        uses: docker/build-push-action@v6
        with:
          context: shinyOAuthDB/integration/local
          target: runner
          tags: shinyoauthdb-local-runner:1
          load: true
          cache-from: type=gha,scope=integration-runner
          cache-to: type=gha,mode=max,scope=integration-runner
      - name: Build the fixture CA initializer
        run: docker build --target tls --tag shinyoauthdb-local-tls:1 integration/local
      - name: Run all integration and demo tests sequentially
        shell: bash
        env:
          CHROMOTE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          failed=0
          run_check() {
            echo "::group::$*"
            "$@" || failed=1
            echo "::endgroup::"
          }

          run_check bash integration/postgres-keycloak/run-integration.sh
          for backend in postgrest trino starrocks minilake; do
            run_check bash integration/local/run-integration.sh "$backend"
          done
          for check in duckdb duckdb-oauth libsql-oauth cratedb-oauth opensearch-oauth clickhouse-parameters clickhouse-http; do
            run_check Rscript --vanilla "tools/check-$check.R"
          done
          for backend in postgres postgrest trino starrocks duckdb libsql cratedb opensearch; do
            run_check Rscript --vanilla tools/check-demos.R "$backend" docker
          done
          for backend in postgrest trino duckdb libsql cratedb opensearch; do
            run_check Rscript --vanilla tools/check-demos.R "$backend" local
          done
          for platform in databricks fabric bigquery snowflake azure-sql azure-postgres redshift clickhouse; do
            run_check Rscript --vanilla tools/check-cloud-demo.R "$platform"
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results
          path: |
            shinyOAuthDB/.validation/
            shinyOAuthDB/integration/*/.generated/
          include-hidden-files: true
          if-no-files-found: warn
