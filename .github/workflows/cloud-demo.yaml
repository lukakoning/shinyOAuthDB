name: Guided cloud demo
on:
  pull_request:
    paths: ['R/cloud-demo*.R', 'R/backend__*.R', 'inst/cloud-demo/**', 'tests/testthat/*cloud*', 'tools/check-cloud-demo.R', 'DESCRIPTION', '.github/workflows/cloud-demo.yaml']
  push:
    branches: [main, master]
    paths: ['R/cloud-demo*.R', 'R/backend__*.R', 'inst/cloud-demo/**', 'tests/testthat/*cloud*', 'tools/check-cloud-demo.R', 'DESCRIPTION', '.github/workflows/cloud-demo.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        platform: [databricks, fabric, bigquery, snowflake, azure-sql, azure-postgres, redshift, clickhouse]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SHINYOAUTHDB_POSTGRES_OAUTH: disabled
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: 'c("Depends", "Imports")'
          extra-packages: |
            any::brickster
            any::processx
            any::callr
            any::pkgbuild
            any::testthat
            any::chromote
            any::jsonlite
            github::lukakoning/shinyOAuth@42176847f6ab82c2b49095f81a829cdd8ce60260
      - name: Check real browser sign-in with a local OAuth fixture
        run: Rscript --vanilla tools/check-cloud-demo.R ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-demo-browser-${{ matrix.platform }}
          path: .validation/cloud-demo/${{ matrix.platform }}/
          if-no-files-found: error
