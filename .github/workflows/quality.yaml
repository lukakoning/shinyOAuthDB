name: Air and Jarl
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: posit-dev/setup-air@v1
        with:
          version: "0.13.0"
      - run: air format . --check
      - uses: etiennebacher/setup-jarl@v0.1.1
        with:
          version: "0.7.1"
