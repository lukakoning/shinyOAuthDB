name: Package checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / R release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"
      SHINYOAUTHDB_POSTGRES_OAUTH: disabled
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgbuild
            any::pkgload
            any::rcmdcheck
            any::covr
            github::lukakoning/shinyOAuth@42176847f6ab82c2b49095f81a829cdd8ce60260
          needs: check
          install-pandoc: true

      - name: Check documentation examples and links
        run: Rscript --vanilla tools/check-docs.R

      - name: Test documentation validation
        run: Rscript --vanilla tools/test-docs.R

      - name: Run tests and R CMD check
        run: Rscript --vanilla tools/check-package.R

      - name: Check DuckDB against a real Quack server
        run: Rscript --vanilla tools/check-duckdb.R

      - name: Check DuckDB OAuth and TLS against quack_oauth
        if: runner.os == 'Linux'
        run: Rscript --vanilla tools/check-duckdb-oauth.R

      - name: Check libSQL JWT, TLS and lost write responses
        if: runner.os == 'Linux'
        run: Rscript --vanilla tools/check-libsql-oauth.R

      - name: Check CrateDB JWT, privileges and TLS against the real server
        if: runner.os == 'Linux'
        run: Rscript --vanilla tools/check-cratedb-oauth.R

      - name: Check OpenSearch JWT, document permissions and TLS
        if: runner.os == 'Linux'
        run: Rscript --vanilla tools/check-opensearch-oauth.R

      - name: Verify validation rejects incomplete runs
        run: Rscript --vanilla tools/test-validation.R

      - name: Verify integration assertion contracts
        run: Rscript --vanilla tools/test-integration.R

      - name: Verify integration source fingerprints
        run: Rscript --vanilla tools/test-provenance.R

      - name: Verify live adapter routes and acceptance validation
        run: Rscript --vanilla tools/test-live.R

      - name: Measure package test coverage
        if: runner.os == 'Linux'
        run: Rscript --vanilla tools/check-coverage.R

      - name: Verify mutation survivor policy
        run: Rscript --vanilla tools/test-mutations.R

      - name: Check timestamp parameters against the real ClickHouse engine
        if: runner.os == 'Linux'
        run: Rscript --vanilla tools/check-clickhouse-parameters.R

      - name: Retain test, dependency and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-validation-${{ matrix.os }}
          path: .validation/
          include-hidden-files: true
          if-no-files-found: warn
