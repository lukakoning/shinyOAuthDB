services:
  database:
    image: trinodb/trino:484@sha256:2704eb53935af5e582d63d6033e9bf99d20c325e9b0e30b1016ef59a4773979f
    network_mode: service:keycloak
    user: "0:0"
    mem_limit: 2g
    entrypoint: ["bash", "/fixture/start.sh"]
    volumes:
      - ../trino-keycloak/etc:/etc/trino:ro
      - ../trino-keycloak/start.sh:/fixture/start.sh:ro
      - fixture_tls:/fixtures/tls:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/fixtures/tls/ca-cert.pem", "https://localhost:18444/v1/info"]
      interval: 3s
      timeout: 5s
      start_period: 30s
      retries: 60
  test-runner:
    image: shinyoauthdb-trino-runner:1
    build:
      context: ../trino-keycloak
    depends_on:
      database:
        condition: service_healthy
