services:
  postgres:
    image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    environment:
      POSTGRES_PASSWORD: fixture-superuser-password
      POSTGRES_DB: oauthdb_fixture
    volumes:
      - ../postgrest-keycloak/fixture.sql:/docker-entrypoint-initdb.d/01-fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oauthdb_fixture"]
      interval: 2s
      timeout: 3s
      retries: 60
  database:
    image: postgrest/postgrest@sha256:1347d7552b88f17832912c06afbf7c43209af6eeeb60834b04aae12c9bd9d5cc
    network_mode: service:keycloak
    environment:
      PGRST_DB_URI: postgres://authenticator:fixture-authenticator-password@postgres:5432/oauthdb_fixture
      PGRST_DB_SCHEMAS: public,reporting
      PGRST_JWT_SECRET: '@/fixtures/jwks.json'
      PGRST_JWT_AUD: local-fixture
      PGRST_SERVER_PORT: "13000"
      PGRST_ADMIN_SERVER_PORT: "13001"
    volumes:
      - fixture_jwks:/fixtures:ro
    depends_on:
      jwks:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
  jwks:
    image: shinyoauthdb-local-runner:1
    network_mode: service:keycloak
    entrypoint: ["Rscript", "-e", "jsonlite::write_json(httr2::resp_body_json(httr2::req_perform(httr2::request('http://localhost:18080/realms/shinyoauthdb/protocol/openid-connect/certs'))), '/fixtures/jwks.json', auto_unbox=TRUE)"]
    volumes:
      - fixture_jwks:/fixtures
    depends_on:
      keycloak:
        condition: service_healthy
  https:
    image: python:3.12.12-slim
    network_mode: service:keycloak
    entrypoint: ["python", "/fixture/proxy.py"]
    volumes:
      - ../postgrest-keycloak/proxy.py:/fixture/proxy.py:ro
      - fixture_tls:/fixtures/tls:ro
    depends_on:
      database:
        condition: service_started
  test-runner:
    depends_on:
      https:
        condition: service_started
volumes:
  fixture_jwks:
